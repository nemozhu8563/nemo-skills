interface:
  display_name: "Game Site Telemetry"
  short_description: "核验 GSC/GA、索引与观察窗口并安排复查"
  default_prompt: "Use $game-site-telemetry within the central game-site-pipeline contract. Verify the current stage, own only this stage's artifacts, pass the central semantic gate, and report blockers without claiming external completion."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "python3"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "read-only access to the exact authorized GSC/GA properties and public sitemap/pages; creation only with separate authorization"
    generated_public_claims: "central-gate-and-evidence-bound"
  permissions:
    network: "read-only access to the exact authorized GSC/GA properties and public sitemap/pages; creation only with separate authorization"
    file_write: "analytics-snapshot.json, 必要时由中央 CLI 写入的 gsc_setup/ga_setup 授权"
    subprocess: "central game-site-pipeline CLI plus project-local checks named by the project"
    interactive: "required for login, property selection ambiguity, CAPTCHA, or creating a new GSC/GA property"
  degradation:
    openai: "central-cli-plus-available-scoped-tools"
    claude: "central-cli-plus-manual-provider-handoff"
    generic: "central-cli-and-human-evidence-handoff"
gates:
  governed:
    - "GSC and GA properties are read back separately"
    - "existing and newly created properties are distinguished"
    - "indexing, configuration and performance are separate evidence"
    - "missing GSC data creates technical checks plus day-7/day-14 reviews"
name: game-site-telemetry
version: 0.1.0
mode: governed
inputs:
  - "初次建站为 `deployed`；复查可从 `hold`；扩页重发可从 `grow` 且 launch readback 已更新"
outputs:
  - "GSC 与 GA 独立的 property readback"
  - "索引、sitemap 和技术检查证据"
  - "带真实时间区间的 analytics-snapshot.json"
  - "telemetry_verified/observing gate 和下一复查日期"
side_effects:
  default: "local project artifacts only"
  external: "only exact user-authorized actions explicitly owned by this Skill"
privacy:
  prohibited: ["passwords", "cookies", "tokens", "private keys", "browser storage", "provider credentials"]
