interface:
  display_name: "Web Business Templater"
  short_description: "把跑通站点拆成框架、配置和内容三层模板"
  default_prompt: "Use $web-business-templater within the central web-business-pipeline contract. Verify the current stage, own only this stage's artifacts, pass the central semantic gate, and report blockers without claiming external completion."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "python3"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "none; public repository publication or package release is out of scope"
    generated_public_claims: "central-gate-and-evidence-bound"
  permissions:
    network: "none; public repository publication or package release is out of scope"
    file_write: "用户指定的本地模板目录, analytics-snapshot.json 中的 template_readiness, 中央 transition 追加的 decision-log.md"
    subprocess: "central web-business-pipeline CLI plus project-local checks named by the project"
    interactive: "required for reusable scope, product-specific exclusions, destination, and final substitution-test approval"
  degradation:
    openai: "central-cli-plus-available-scoped-tools"
    claude: "central-cli-plus-manual-provider-handoff"
    generic: "central-cli-and-human-evidence-handoff"
gates:
  production:
    - "framework, configuration and content layers are explicit"
    - "project-specific assets, claims, sources, domains and telemetry IDs are excluded"
    - "navigation, routes, SEO and sitemap derive from config/content"
    - "a second-product substitution test is reviewed before approval"
name: web-business-templater
version: 1.0.0
mode: production
inputs:
  - "`grow` 且第一个站点已有人工批准的有效数据决策"
outputs:
  - "框架/配置/内容三层边界清单"
  - "无产品身份和凭证的本地模板"
  - "第二产品 substitution test 与残留扫描证据"
  - "批准后的 template_readiness 和 templated gate"
side_effects:
  default: "local project artifacts only"
  external: "only exact user-authorized actions explicitly owned by this Skill"
privacy:
  prohibited: ["passwords", "cookies", "tokens", "private keys", "browser storage", "provider credentials"]
