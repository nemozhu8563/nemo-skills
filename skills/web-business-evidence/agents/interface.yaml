interface:
  display_name: "Web Business Evidence"
  short_description: "为每页建立双来源和 claim 级证据包"
  default_prompt: "Use $web-business-evidence within the central web-business-pipeline contract. Verify the current stage, own only this stage's artifacts, pass the central semantic gate, and report blockers without claiming external completion."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "python3"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "read-only public source research; authenticated or private sources require explicit scope and no credential capture"
    generated_public_claims: "central-gate-and-evidence-bound"
  permissions:
    network: "read-only public source research; authenticated or private sources require explicit scope and no credential capture"
    file_write: "evidence-pack.json"
    subprocess: "central web-business-pipeline CLI plus project-local checks named by the project"
    interactive: "required when source trust, freshness or conflicting claims cannot be resolved from evidence"
  degradation:
    openai: "central-cli-plus-available-scoped-tools"
    claude: "central-cli-plus-manual-provider-handoff"
    generic: "central-cli-and-human-evidence-handoff"
gates:
  production:
    - "every page references at least two distinct source lineages"
    - "claims marked current_trusted have current official or trusted evidence"
    - "missing evidence stays missing"
    - "competitor prose and proprietary assets are not copied"
name: web-business-evidence
version: 1.0.0
mode: production
inputs:
  - "初次建站为 `planned`；优化/扩展模式仅由 `$web-business-expander` 在 `grow` 中调用"
outputs:
  - "来源注册表及可靠性/时效信息"
  - "逐页至少两条独立来源覆盖"
  - "claim 到 source 的可审计映射"
  - "researched gate 或 optimization/expansion validation 结果"
side_effects:
  default: "local project artifacts only"
  external: "none unless the Skill explicitly owns and receives exact authorization"
privacy:
  prohibited: ["passwords", "cookies", "tokens", "private keys", "browser storage", "provider credentials"]
