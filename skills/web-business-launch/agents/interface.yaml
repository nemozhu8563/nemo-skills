interface:
  display_name: "Web Business Launch"
  short_description: "逐项授权执行上线动作并记录真实线上回读"
  default_prompt: "Use $web-business-launch within the central web-business-pipeline contract. Verify the current stage, own only this stage's artifacts, pass the central semantic gate, and report blockers without claiming external completion."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "agent-skills-compatible"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "python3"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "only the exact provider, registrar, Git remote, DNS, and public URL covered by the current authorization"
    generated_public_claims: "central-gate-and-evidence-bound"
  permissions:
    network: "only the exact provider, registrar, Git remote, DNS, and public URL covered by the current authorization"
    file_write: "pipeline-state.json 中由中央 CLI 写入的逐项授权, launch-report.json 中的 external_actions、deployment、http_readback"
    subprocess: "central web-business-pipeline CLI plus project-local checks named by the project"
    interactive: "required for each external action unless the current user instruction already explicitly authorizes that exact action and scope"
  degradation:
    openai: "central-cli-plus-available-scoped-tools"
    claude: "central-cli-plus-manual-provider-handoff"
    generic: "central-cli-and-human-evidence-handoff"
gates:
  governed:
    - "domain, DNS, Git push, deployment and ads are separate permissions"
    - "authorization is not execution and execution is not readback"
    - "deployment revision and public HTTP response are recorded"
    - "unused or failed authorization can be revoked and rollback is actionable"
name: web-business-launch
version: 1.0.0
mode: governed
inputs:
  - "初次建站为 `deploy_ready`；优化/扩展重发模式由 `$web-business-expander` 在 `grow` 且 QA 通过后调用"
outputs:
  - "每项外部动作的精确授权记录"
  - "Git/provider/domain/DNS/HTTP 相互独立的真实回读"
  - "与实际部署 revision 一致的 launch-report.json"
  - "deployed gate 或 optimization/expansion deployment validation 结果"
side_effects:
  default: "local project artifacts only"
  external: "only exact user-authorized actions explicitly owned by this Skill"
privacy:
  prohibited: ["passwords", "cookies", "tokens", "private keys", "browser storage", "provider credentials"]
